version: "3.9"
services:
  backend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    command: bash -lc "pip install -r backend/requirements.txt && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./backend/support_agent.db
      - CHROMA_DB_DIR=./backend/.chroma
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - CORS_ORIGINS=http://localhost:3000
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -lc "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    depends_on:
      - backend
